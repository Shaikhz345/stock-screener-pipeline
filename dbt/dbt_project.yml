name: stock_screener
version: "1.0.0"
profile: stock_screener

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  stock_screener:
    staging:
      +materialized: view
      +schema: staging

seeds:
  stock_screener:
    +schema: seeds
    sector_mapping:
      +column_types:
        sector_code: int
        sic_start: int
        sic_end: int
    sector_rule_overrides:
      +column_types:
        sic_start: int
        sic_end: int
